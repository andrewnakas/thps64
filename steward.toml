# Decompathon Steward config for the THPS N64 decomp (private pilot).
[project]
name = "thps64"
repo = "andrewnakas/thps64"  # private
default_branch = "main"
unit_kind = "address"
# one C file per function: src/funcs/func_XXXXXXXX.c (claims and progress stay per address)
unit_paths = ["src/funcs/**"]
unit_regex = 'func_([0-9A-F]{8})\.c$'
function_table = "config/functions.csv"

[policy]
auto_merge = true
first_timer_needs_human = true
owner_rule_days = 7
max_units_per_pr = 20
maintainers = ["andrewnakas"]
# one person, two accounts: nakasmakes is the owner's own Codex account (confirmed by the owner 2026-10-23)
identities = [["andrewnakas", "nakasmakes"]]
protected_paths = ["tools/**", "config/**", "Makefile", "RULES.md", "PROVENANCE.md", "CODEOWNERS"]
claim_lapse_days = 7
claim_warn_days = 5
# provenance (PROVENANCE.md): every box, exactly one "who made this", agents acknowledge on every PR
required_checkboxes = ["Own work:", "No leaked material:", "No game data:", "Lawful decompilation:", "Sources listed:"]
made_by_checkboxes = ["Written by me", "Prepared by an AI agent"]
agent_marker = "Prepared by an AI agent"
agent_checkboxes = ["Agent acknowledgement:"]

# Oracle: KMC GCC 2.7.2 + gas 2.6 compile every src/funcs file and compare it with the unpacked game code.
# Needs the owner's ROM, so it runs on the judge box (owner's PC), never on GitHub runners.
[[gates]]
name = "match"
run = "python tools/gate.py"
where = "judge"

# Whole-binary zero-loss: rebuild the main segment from C + asm and require it byte-identical to the game.
[[gates]]
name = "build"
run = "python tools/build.py"
where = "judge"

[models]
backend = "claude-code"
triage = "claude-haiku-5-5"
review = "claude-sonnet-5-5"
plan = "claude-opus-5-5"
mentor = "claude-sonnet-5-5"

[github]
app = "decompathon-steward"

