# Publishes the README progress badge/bar to the `progress` branch after every change on main (no ROM needed).
name: progress
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: progress
  cancel-in-progress: true
jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build badge files
        run: python tools/progress_badge.py out
      - name: Publish to the progress branch
        run: |
          cd out
          git init -q -b progress
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress.json progress.svg
          git commit -q -m "progress: $(python3 -c 'import json;print(json.load(open("progress.json"))["message"])')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" progress
